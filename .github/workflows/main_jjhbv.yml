# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - jjhbv

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_9d92cc6e583242fca53384aa0d39246b }}
        password: ${{ secrets.AzureAppService_ContainerPassword_028d20d5f9eb427fbba990b03dc2949d }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_9d92cc6e583242fca53384aa0d39246b }}/hemanthkumar31/algocore:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'jjhbv'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_1e428bd5d52742c7b60d206b28a9415c }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_9d92cc6e583242fca53384aa0d39246b }}/hemanthkumar31/algocore:${{ github.sha }}'