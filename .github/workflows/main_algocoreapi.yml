# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - algocoreapi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_a064ac114ed44237b3acc09a4e5ee561 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_c5ceda10a4514df2a586c646a985b9d6 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_a064ac114ed44237b3acc09a4e5ee561 }}/hemanthkumar31/code-runner:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'algocoreapi'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_ed7291f51371466889fe7cc6b61c871e }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_a064ac114ed44237b3acc09a4e5ee561 }}/hemanthkumar31/code-runner:${{ github.sha }}'