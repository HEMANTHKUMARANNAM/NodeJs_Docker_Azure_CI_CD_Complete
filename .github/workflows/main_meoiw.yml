# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - meoiw

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_523d0320bb6446a4931538aaa7509d4c }}
        password: ${{ secrets.AzureAppService_ContainerPassword_745bb4cfbf524c13837a99b60eec634a }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/algocore:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'meoiw'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_d4dfa9d1fb4941399217a5a4ff756f11 }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_523d0320bb6446a4931538aaa7509d4c }}/hemanthkumar31/algocore:${{ github.sha }}'